<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline – Školní výbor</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f9fafb;
        color: #111827;
        padding: 1.5rem;
      }
      .card {
        max-width: 24rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; color: #6b7280; margin: 0 0 1.25rem; line-height: 1.5; }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size: 2.5rem; margin-bottom: 0.75rem">📡</div>
      <h1>Jste offline</h1>
      <p>
        Nepodařilo se připojit k serveru. Zkontrolujte prosím připojení k internetu
        a zkuste to znovu.
      </p>
      <button onclick="location.reload()">Zkusit znovu</button>
    </div>
  </body>
</html>
